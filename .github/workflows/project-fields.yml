# Copies planning fields from issues to Pushpull Devroad.
name: Project board fields

on:
  issues:
    types: [opened, edited, milestoned, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to sync again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: project-fields-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fill:
    name: Fill board fields
    # The manual workflow is available to people with repository write access.
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the issue's planning fields to the board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: abdurryy
          PROJECT_NUMBER: "2"
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PROJECT_TOKEN secret is missing, so the board fields were not filled. See CONTRIBUTING.md, Repo setup."
            exit 0
          fi
          node .github/scripts/fillProjectFields.mjs
