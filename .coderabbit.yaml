# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config. GitHub reads the required check and approvals from the
# ruleset in .github/rulesets/protect-main.json (see CONTRIBUTING.md).
language: en-US
tone_instructions: >-
  Be brief and practical. Comment on bugs, broken course rules (MVP layers, loading/empty/error
  states, accessibility) and security. Skip style preferences, wording and formatting nitpicks.

reviews:
  profile: chill
  high_level_summary: true

  # A short walkthrough: no fortunes, diagrams, effort estimates or reviewer suggestions
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_reviewers: false

  # CodeRabbit requests changes only for major or critical findings and approves
  # otherwise. Minor comments stay visible as advice. Its approval is the one
  # approval GitHub requires.
  auto_approvals:
    enabled: true
    min_blocking_severity: major
    allow_author_approval: false # PR authors can't "@coderabbitai approve" their own PR

  # No one-click "Fix comments" commits: they have reverted other work before.
  # Fixes are made on the branch by the PR author.
  finishing_touches:
    autofix:
      enabled: false

  # Grammar and markdown-style linters only produce nitpicks on our docs
  tools:
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

  # Post the "CodeRabbit" check, and fail it if the review errors out,
  # so the required status check blocks the merge.
  review_progress: true
  fail_commit_status: true

  auto_review:
    enabled: true
    drafts: false

  # Check the PR against the issue it closes (acceptance criteria, approach)
  assess_linked_issues: true
  related_issues: true

  # Copies of Canvas pages, not our code
  path_filters:
    - "!docs/course/**"

  path_instructions:
    - path: "**/*.md"
      instructions: |
        Team docs. Only flag factual errors, broken links, or contradictions with other docs or
        the ruleset. Don't comment on wording, tone, length or formatting.
    - path: ".github/rulesets/**"
      instructions: |
        The merge rules are a deliberate team decision: 1 approval from anyone with write access
        (CodeRabbit's or a teammate's) and the CodeRabbit check. Open threads do not block merging;
        outstanding change requests do. Don't ask for
        stricter or different approval rules. Only flag invalid JSON or rules that contradict
        CONTRIBUTING.md.
    - path: "src/**/*.{js,jsx}"
      instructions: |
        This is a student course project. Every developer must be able to explain their code to a teacher.
        Flag code that is hard to explain: clever one-liners, deep nesting, unnecessary abstractions,
        unclear names, functions doing more than one thing, and new libraries that the task doesn't need.
        Suggest the simpler version. Follow the course lab conventions: callbacks end in ACB
        (event, promise, side-effect callbacks) or CB (array callbacks); code copied from the lab must
        have a comment saying so. Check DRY, naming and formatting (all graded).
    - path: "src/presenters/**"
      instructions: |
        MVP rule: a Presenter only reads the model, passes props to Views and handles custom events by
        calling ONE model method. Flag as errors: fetch calls, persistence/Firebase code, component state
        (useState), useEffect for data logic, reading the route (useLocation/useRoute), and any JSX
        markup or CSS beyond a single wrapping <div> or <> (a single suspense image is OK).
    - path: "src/views/**"
      instructions: |
        MVP rule: a View only renders props and fires custom events named onXxx. Flag imports of the
        model, API or persistence code, and any data processing that belongs in the model.
        Flag Views that show data but have no loading, empty or error state; inputs without a visible
        <label>; images without alt; clickable <div>/<span> instead of <button> or <a>; removed focus
        outlines. Styling follows docs/design.md: flag hard-coded colours, font families, px font
        sizes, radii, shadows or durations instead of var(--token) from src/styles/tokens.css, orange
        (--color-team-a) used as a text colour, and team colour shown without a team name or letter.
        In controller views, flag actions bound to click instead of pointerdown. Don't suggest new
        colours, fonts or visual effects.
    - path: "src/model/**"
      instructions: |
        The model holds all application state and the logic that changes it. One user action should be
        one model method. Persistence must happen in side effects, not in the methods themselves.

# Issues labelled "feature" get an implementation plan from CodeRabbit,
# which the assignee (or their coding agent) can follow.
issue_enrichment:
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - feature
